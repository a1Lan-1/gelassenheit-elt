# schedule: hourly :05 MSK (after FSD :00); override per entity optional
# source_timezone: UTC — Postgres timestamptz; bronze serialize in naive MSK
entities:
- entity: ai_bot_sessions
  source_table: public.ai_bot_sessions
  watermark_column: updated_at
  primary_key:
  - ticket_id
  load_mode: upsert_current
  schedule: "5 * * * *"
  columns:
  - name: ticket_id
    clickhouse_type: UUID
    nullable: false
  - name: session_id
    clickhouse_type: UUID
    nullable: false
  - name: ticket_created_at
    clickhouse_type: DateTime64(3)
    nullable: true
  - name: started_at
    clickhouse_type: DateTime64(3)
    nullable: false
  - name: is_classified
    clickhouse_type: UInt8
    nullable: false
  - name: classified_at
    clickhouse_type: DateTime64(3)
    nullable: true
  - name: classified_service_id
    clickhouse_type: UUID
    nullable: true
  - name: reject_reason
    clickhouse_type: String
    nullable: true
  - name: is_routed
    clickhouse_type: UInt8
    nullable: false
  - name: routed_at
    clickhouse_type: DateTime64(3)
    nullable: true
  - name: routed_reason
    clickhouse_type: String
    nullable: true
  - name: in_group_id
    clickhouse_type: String
    nullable: true
  - name: out_group_id
    clickhouse_type: String
    nullable: true
  - name: is_answered
    clickhouse_type: UInt8
    nullable: false
  - name: answered_at
    clickhouse_type: DateTime64(3)
    nullable: true
  - name: user_continued
    clickhouse_type: UInt8
    nullable: false
  - name: continued_at
    clickhouse_type: DateTime64(3)
    nullable: true
  - name: outcome
    clickhouse_type: String
    nullable: true
  - name: outcome_at
    clickhouse_type: DateTime64(3)
    nullable: true
  - name: rating
    clickhouse_type: Int16
    nullable: true
  - name: rating_at
    clickhouse_type: DateTime64(3)
    nullable: true
  - name: dialogs_count
    clickhouse_type: Int32
    nullable: false
  - name: updated_at
    clickhouse_type: DateTime64(3)
    nullable: false

