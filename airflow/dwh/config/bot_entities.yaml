# Mapping: sessions.ticket_id / dialogs.fsd_item_id = fsd_items.id
#           fsd_items.fsd_id = FSD ticket UUID (mart_tickets_enriched.id)
- entity: fsd_items
  source_table: public.fsd_items
  watermark_column: updated_at
  primary_key:
  - id
  load_mode: upsert_current
  schedule: "5 * * * *"
  columns:
  - name: id
    clickhouse_type: UUID
    nullable: false
  - name: fsd_id
    clickhouse_type: UUID
    nullable: true
  - name: fsd_number
    clickhouse_type: String
    nullable: true
  - name: entity_type
    clickhouse_type: String
    nullable: false
  - name: updated_at
    clickhouse_type: DateTime64(3)
    nullable: false
