- entity: history
  source_table: public.history
  watermark_column: updated_at
  primary_key:
  - id
  load_mode: upsert_current
  batch_size: 25000
  extract_sql: "SELECT\n  id, user_id, action_type, object_type, object_id,\n  old_values::text\
    \ AS old_values,\n  new_values::text AS new_values,\n  fields::text AS fields,\n\
    \  created_at, updated_at, deleted_at\nFROM public.history\nWHERE updated_at >\
    \ %(watermark)s\n  AND object_type IN ('appeals','comments','tickets','tasks','ticket_status','task_status')\n\
    ORDER BY updated_at, id\n"
  columns:
  - name: id
    clickhouse_type: UUID
    nullable: false
  - name: user_id
    clickhouse_type: UUID
    nullable: true
  - name: action_type
    clickhouse_type: String
    nullable: false
  - name: object_type
    clickhouse_type: String
    nullable: false
  - name: object_id
    clickhouse_type: UUID
    nullable: false
  - name: old_values
    clickhouse_type: JSON
    nullable: true
    semantic_type: json
  - name: new_values
    clickhouse_type: JSON
    nullable: true
    semantic_type: json
  - name: fields
    clickhouse_type: JSON
    nullable: true
    semantic_type: json
  - name: created_at
    clickhouse_type: DateTime64(3)
    nullable: false
  - name: updated_at
    clickhouse_type: DateTime64(3)
    nullable: false
  - name: deleted_at
    clickhouse_type: DateTime64(3)
    nullable: true
